// Store v6 stability configuration for the Compose compiler.
// Core public value types are deeply immutable by construction (vals only, gated by BCV dumps).
// Their equals is identity (documented behavioral contract), so treating them as stable never
// wrongly skips: an equals comparison can only report "unchanged" for the same instance.
// Add this file via composeCompiler.stabilityConfigurationFiles (Compose compiler 1.5.5+ /
// Kotlin 2.x compose plugin) if you are on an older baseline or want skipping without
// strong skipping's instance comparison.
org.mobilenativefoundation.store6.core.*
org.mobilenativefoundation.store6.core.seam.*
