project(':store6-graphql-sample').projectDir = file('store6-graphql/sample')
include ':store6-realtime'
include ':store6-realtime-sample'
project(':store6-realtime-sample').projectDir = file('store6-realtime/sample')
include ':store6-benchmarks'
include ':store6-devtools'
include ':store6-devtools-inspector'
include ':store6-devtools-demo'
include ':store6-mutations'
include ':store6-mutations-quickstart'
include ':store6-mutations-testing'
include ':store6-mutations-sqldelight'
