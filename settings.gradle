include ':swift-dumps-mutations-objc'
project(':swift-dumps-mutations-objc').projectDir = file('swift-dumps/mutations-objc')
include ':swift-dumps-mutations-skie'
project(':swift-dumps-mutations-skie').projectDir = file('swift-dumps/mutations-skie')
include ':extension-probe'
include ':testing'
include ':sqldelight'
include ':sqldelight-sample'
project(':sqldelight-sample').projectDir = file('sqldelight/sample')
include ':compose'
include ':compose-demo'
include ':room'
