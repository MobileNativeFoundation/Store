name: Store6 release record repair

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose Maven publication completed
        required: true
        type: string
      source_run_id:
        description: CI run that saved the completed publication receipt
        required: true
        type: string
      source_run_attempt:
        description: Attempt that saved the completed publication receipt
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  repair-record:
    if: ${{ github.repository == 'MobileNativeFoundation/Store' }}
    runs-on: ubuntu-latest
    concurrency:
      group: maven-publication-refs/tags/${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout the published tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Bind the receipt to the published source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[0-9]+$ ]]
          version="$(python3 .github/scripts/release_control.py version)"
          test "${RELEASE_TAG}" = "v${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}" > source-run.json
          test "$(jq -r .head_sha source-run.json)" = "$(git rev-parse HEAD)"
          test "$(jq -r .path source-run.json)" = ".github/workflows/ci.yml"
          test "$(jq -r .event source-run.json)" = push
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Retrieve the preserved publication receipt
        uses: actions/download-artifact@v4
        with:
          name: publication-receipt-${{ steps.source.outputs.sha }}-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: publication-record

      - name: Repair the GitHub Release without Maven publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_control.py record --receipt publication-record/publication-receipt.json
